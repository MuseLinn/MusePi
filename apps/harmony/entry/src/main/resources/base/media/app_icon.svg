    <radialGradient id="shell" cx="0.34" cy="0.26" r="0.92">
      <stop offset="0" stop-color="oklch(89.07% 0.0798 79.84)"/>
      <stop offset="0.5" stop-color="oklch(65% 0.105 79.84)"/>
      <stop offset="1" stop-color="oklch(33% 0.08 79.84)"/>
