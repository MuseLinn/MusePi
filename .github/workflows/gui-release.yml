name: GUI Desktop Release

# MusePi Desktop (Electron) 发布：按平台并行构建 natives + 打包 dmg。
# 与 CLI/npm 发布(cicd ci.yml)分离——CLI/TUI 和 Desktop 分别打包发布。
on:
   push:
      tags:
         - "v*"
   workflow_dispatch:

concurrency:
   group: gui-release-${{ github.ref }}
   cancel-in-progress: true

permissions:
   contents: read

jobs:
   package_darwin:
      name: "MusePi dmg: ${{ matrix.target_id }}"
      strategy:
         fail-fast: false
         matrix:
            include:
               - {
                    os: macos-14,
                    target_id: darwin-arm64,
                    native_targets: darwin-arm64,
                 }
      runs-on: ${{ matrix.os }}
      env:
         MACOS_SIGNING: ${{ secrets.APPLE_CERTIFICATE_P12 != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER_ID != '' && secrets.APPLE_API_KEY != '' }}
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

         - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
           with:
              bun-version: "1.3"

         - name: Cache bun dependencies
           uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
           with:
              path: ~/.bun/install/cache
              key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}

         - name: Install workspace
           run: bun install --frozen-lockfile

         - name: Build native addon (bazel)
           uses: ./.github/actions/bazel-natives
           with:
              targets: ${{ matrix.native_targets }}
              cache-scope: gui-release-${{ matrix.target_id }}

         - name: Build daemon binary (musepi CLI)
           working-directory: packages/coding-agent
           run: bun run build

         - name: Stage daemon binary into GUI vendor
           run: |
              mkdir -p packages/gui/vendor/daemon
              cp packages/coding-agent/dist/musepi packages/gui/vendor/daemon/musepi
              chmod +x packages/gui/vendor/daemon/musepi

         - name: Build GUI renderer
           working-directory: packages/gui
           run: bun run build

         - name: Package dmg
           run: bunx electron-builder --mac --publish never
           working-directory: packages/gui

         - name: Upload dmg artifact
           uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
           with:
              name: musepi-dmg-${{ matrix.target_id }}
              path: packages/gui/release/*.dmg
              if-no-files-found: error

   publish:
      name: "Publish MusePi dmg releases"
      if: startsWith(github.ref, 'refs/tags/v')
      needs: [package_darwin]
      runs-on: ubuntu-22.04
      permissions:
         contents: write
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

         - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
           with:
              pattern: musepi-dmg-*
              path: dist
              merge-multiple: true

         - name: Generate OTA update-manifest
           # BitFun parity: /releases/latest/download/update-manifest.json redirects
           # to THIS asset on the newest release. version = gui/package.json, url =
           # the arm64 dmg, notes = the newest CHANGELOG.musepi section.
           shell: bash
           run: |
              set -euo pipefail
              node --input-type=module <<'EOF'
              import fs from "node:fs";
              const pkg = JSON.parse(fs.readFileSync("packages/gui/package.json", "utf8"));
              const tag = process.env.GITHUB_REF_NAME || `v${pkg.version}`;
              const changelog = fs.readFileSync("packages/coding-agent/CHANGELOG.musepi.md", "utf8");
              // Take the LATEST ## [x.y.z] section (the one after the header is
              // the oldest; sections split from "## [" puts newest LAST when the
              // file lists oldest-first)
              const sections = changelog.split(/^## \[/m).slice(1);
              const notes = sections.length ? `## [${sections[sections.length - 1]}`.trim() : "";
              const manifest = {
                version: pkg.version,
                url: `https://github.com/MuseLinn/MusePi/releases/download/${tag}/MusePi-${pkg.version}-arm64.dmg`,
                notes,
              };
              fs.writeFileSync("packages/gui/update-manifest.json", JSON.stringify(manifest, null, "\t") + "\n");
              console.log("update-manifest:", manifest.version, manifest.url);
              EOF
              # Stage it beside the dmg for the upload step
              cp packages/gui/update-manifest.json dist/update-manifest.json

         - name: Upload release assets
           uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
           with:
              files: |
                dist/*.dmg
                dist/update-manifest.json
              generate_release_notes: true
