name: Prune stale caches

# Keeps the repo's actions/cache usage under GitHub's 10 GB quota.
#
# The failure this prevents is silent and looks like flakiness rather than
# breakage: once the quota is exceeded GitHub evicts by last-access, so a run
# that should have restored a warm bazel disk cache (~1.15 GB per generation)
# occasionally misses it and takes minutes longer. Measured 2026-09-17: the
# repo was at 10.21 GB, of which 4.68 GB (46%) was unreachable garbage —
# tag-scoped release caches stranded on the malformed branch ref
# `refs/heads/refs/tags/vX.Y.Z`, which no main-branch job can ever restore.
#
# The rules live in scripts/prune-caches.ts (unit-tested): unreachable refs are
# deleted outright, whole generation groups untouched for --group-idle days are
# expired, and older generations beyond the newest --keep in a group go. Release
# caches (`bazel-disk-v3-release-*`) are exempt from the idle rule — a slow
# release build is worse than the space it holds.
on:
   schedule:
      # Mondays 04:17 UTC — off the round hour so it does not queue behind the
      # cron thundering herd.
      - cron: "17 4 * * 1"
   workflow_dispatch:

# Deleting caches needs actions: write; nothing else is touched.
permissions:
   contents: read
   actions: write

concurrency:
   group: cache-prune
   cancel-in-progress: false

jobs:
   prune:
      name: Prune stale cache entries
      runs-on: ubuntu-22.04
      timeout-minutes: 10
      steps:
         - uses: actions/checkout@v4
         - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
           with:
              bun-version: "1.3"
         - name: Prune (dry run first, so the log shows what will go)
           env:
              GH_TOKEN: ${{ github.token }}
           run: bun scripts/prune-caches.ts
         - name: Prune
           env:
              GH_TOKEN: ${{ github.token }}
           run: bun scripts/prune-caches.ts --apply
