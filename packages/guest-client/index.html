<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
		/>
		<meta name="color-scheme" content="light dark" />
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#faf7fc" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f0b14" />

		<title>musepi collab — live agent session in your browser</title>
		<meta
			name="description"
			content="Guest client for musepi collab sessions: watch a live coding-agent session — streaming transcript, tool calls, subagents — and prompt the host agent from any browser. End-to-end encrypted; the room key never leaves the URL fragment."
		/>
		<meta name="author" content="can1357" />
		<meta name="robots" content="index, follow, max-image-preview:large" />

		<link rel="icon" type="image/svg+xml" href="./public/favicon.svg" />
		<link rel="icon" type="image/x-icon" href="./public/favicon.ico" sizes="any" />
		<link rel="icon" type="image/png" sizes="256x256" href="./public/favicon.png" />
		<link rel="icon" type="image/png" sizes="32x32" href="./public/favicon-32x32.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="./public/favicon-16x16.png" />
		<link rel="apple-touch-icon" sizes="180x180" href="./public/favicon-180x180.png" />
		<link rel="manifest" href="./public/manifest.webmanifest" />

		<!-- Open Graph -->
		<meta property="og:site_name" content="omp" />
		<meta property="og:type" content="website" />
		<meta property="og:title" content="musepi collab — live agent session in your browser" />
		<meta
			property="og:description"
			content="Watch a live musepi session and prompt the host agent from any browser. End-to-end encrypted; the key stays in the URL fragment."
		/>
		<meta property="og:locale" content="en_US" />

		<!-- Twitter / X -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="musepi collab — live agent session in your browser" />
		<meta
			name="twitter:description"
			content="Watch a live musepi session and prompt the host agent from any browser. End-to-end encrypted; the key stays in the URL fragment."
		/>

		<!-- Structured data: WebApplication -->
		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@type": "WebApplication",
				"name": "musepi collab",
				"applicationCategory": "DeveloperApplication",
				"operatingSystem": "Any",
				"description": "Browser guest client for musepi collab live sessions: streaming transcript, tool calls, subagent panel, and a composer that prompts the host agent. End-to-end encrypted.",
				"isPartOf": { "@type": "WebSite", "name": "musepi" }
			}
		</script>

		<!-- PWA: service worker for offline shell / static cache — registered
		     after the theme script to avoid racing the first render. -->
		<script>
			if ("serviceWorker" in navigator) {
				navigator.serviceWorker.register("./sw.js").catch(() => {});
			}
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script>(function(){try{var s=localStorage.getItem("omp-collab-theme");var sys=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";var t=(s==="light"||s==="dark")?s:sys;document.documentElement.dataset.theme=t;document.documentElement.style.colorScheme=t;}catch(e){}})();</script>
		<script>
			// Capacitor shell → dedicated mobile entry (mobile.html): mobile-only
			// CSS, splash, keyboard/status-bar bridges. Desktop browsers have no
			// Capacitor global and load the web bundle below untouched. (The
			// shell serves every route as / — never gate on pathname.)
			if (window.Capacitor != null) {
				location.replace("./mobile.html");
			}
		</script>
		<script type="module" src="./src/main.tsx"></script>
	</body>
</html>
